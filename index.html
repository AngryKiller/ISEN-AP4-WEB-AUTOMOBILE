<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mon Garage — Ma collection de véhicules</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
  </head>
  <body>
    <!-- ===== En-tête ===== -->
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true">🚗</span>
        <div>
          <h1 class="header__title">Mon Garage</h1>
          <p class="header__subtitle">Ma collection de véhicules</p>
        </div>
      </div>

      <!-- Sélecteur de thème : auto / clair / sombre -->
      <div class="theme" role="group" aria-label="Choix du thème">
        <button type="button" class="theme__btn" data-theme-choix="auto" title="Automatique (système)">
          <span aria-hidden="true">🖥️</span><span class="theme__label">Auto</span>
        </button>
        <button type="button" class="theme__btn" data-theme-choix="clair" title="Thème clair">
          <span aria-hidden="true">☀️</span><span class="theme__label">Clair</span>
        </button>
        <button type="button" class="theme__btn" data-theme-choix="sombre" title="Thème sombre">
          <span aria-hidden="true">🌙</span><span class="theme__label">Sombre</span>
        </button>
      </div>
    </header>

    <main class="content">
      <!-- ===== Statistiques ===== -->
      <section class="stats" aria-label="Statistiques du garage">
        <article class="stat">
          <span class="stat__value" id="stat-total">0</span>
          <span class="stat__label">Véhicules</span>
        </article>
        <article class="stat">
          <span class="stat__value" id="stat-favoris">0</span>
          <span class="stat__label">Favoris</span>
        </article>
        <article class="stat">
          <span class="stat__value" id="stat-valeur">0 €</span>
          <span class="stat__label">Valeur totale</span>
        </article>
        <article class="stat">
          <span class="stat__value" id="stat-km">0 km</span>
          <span class="stat__label">Kilométrage moyen</span>
        </article>
      </section>

      <!-- ===== Barre d'outils : recherche, filtres, tri, ajout ===== -->
      <section class="toolbar" aria-label="Recherche et filtres">
        <label class="field field--search">
          <span class="visually-hidden">Rechercher</span>
          <input type="search" id="recherche" placeholder="Rechercher une marque, un modèle…" autocomplete="off" />
        </label>

        <label class="field">
          <span class="visually-hidden">Filtrer</span>
          <select id="filtre">
            <option value="tous">Tous les véhicules</option>
            <option value="favoris">❤️ Favoris uniquement</option>
            <option value="essence">Essence</option>
            <option value="diesel">Diesel</option>
            <option value="hybride">Hybride</option>
            <option value="electrique">Électrique</option>
          </select>
        </label>

        <label class="field">
          <span class="visually-hidden">Trier</span>
          <select id="tri">
            <option value="recent">Plus récents ajoutés</option>
            <option value="annee-desc">Année ↓</option>
            <option value="annee-asc">Année ↑</option>
            <option value="prix-desc">Prix ↓</option>
            <option value="prix-asc">Prix ↑</option>
            <option value="km-asc">Kilométrage ↑</option>
            <option value="marque">Marque A → Z</option>
          </select>
        </label>

        <button type="button" class="btn btn--primary" id="btn-ajouter">
          <span aria-hidden="true">＋</span> Ajouter un véhicule
        </button>
      </section>

      <!-- ===== Liste des véhicules (grille responsive) ===== -->
      <section class="garage" id="garage" aria-live="polite"></section>

      <!-- État vide -->
      <div class="empty-state" id="vide" hidden>
        <span class="empty-state__icon" aria-hidden="true">🏁</span>
        <p class="empty-state__text">Aucun véhicule à afficher.</p>
        <p class="empty-state__help">Ajoutez votre première voiture ou modifiez vos filtres.</p>
      </div>
    </main>

    <!-- ===== Formulaire d'ajout / modification (boîte de dialogue native) ===== -->
    <dialog class="modal" id="modale">
      <form class="form" id="formulaire" novalidate>
        <header class="form__header">
          <h2 class="form__title" id="formulaire-titre">Ajouter un véhicule</h2>
          <button type="button" class="btn btn--icon" id="btn-fermer" aria-label="Fermer">✕</button>
        </header>

        <input type="hidden" name="id" />

        <div class="form__grid">
          <label class="field field--form">
            <span class="field__label">Marque <em>*</em></span>
            <input type="text" name="marque" list="liste-marques" placeholder="Ex : Peugeot" required maxlength="40" autocomplete="off" />
            <datalist id="liste-marques"></datalist>
            <small class="field__error" data-erreur="marque" data-error="make"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Modèle <em>*</em> <span class="field__hint" id="indice-modeles"></span></span>
            <input type="text" name="modele" list="liste-modeles" placeholder="Ex : 208" required maxlength="40" autocomplete="off" />
            <datalist id="liste-modeles"></datalist>
            <small class="field__error" data-erreur="modele" data-error="model"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Année <em>*</em></span>
            <input type="number" name="annee" placeholder="2020" required min="1886" step="1" inputmode="numeric" />
            <small class="field__error" data-erreur="annee" data-error="year"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Kilométrage (km) <em>*</em></span>
            <input type="number" name="kilometrage" placeholder="45000" required min="0" step="1" inputmode="numeric" />
            <small class="field__error" data-erreur="kilometrage" data-error="mileage"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Prix estimé (€) <em>*</em></span>
            <input type="number" name="prix" placeholder="12000" required min="0" step="1" inputmode="numeric" />
            <small class="field__error" data-erreur="prix" data-error="price"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Vidange (km)</span>
            <input type="number" name="nextOilChangeKm" placeholder="15000" min="0" step="100" inputmode="numeric" />
            <small class="field__error" data-error="nextOilChangeKm"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Révision (km)</span>
            <input type="number" name="nextRevisionKm" placeholder="20000" min="0" step="100" inputmode="numeric" />
            <small class="field__error" data-error="nextRevisionKm"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Dernière révision</span>
            <input type="date" name="lastRevisionDate" />
            <small class="field__error" data-error="lastRevisionDate"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Carburant <em>*</em></span>
            <select name="carburant" required>
              <option value="">— Choisir —</option>
              <option value="essence">Essence</option>
              <option value="diesel">Diesel</option>
              <option value="hybride">Hybride</option>
              <option value="electrique">Électrique</option>
            </select>
            <small class="field__error" data-erreur="carburant" data-error="fuel"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Immatriculation</span>
            <input type="text" name="immatriculation" placeholder="AB-123-CD" maxlength="9" autocomplete="off" />
            <small class="field__error" data-erreur="immatriculation" data-error="licensePlate"></small>
          </label>

          <label class="field field--form field--color">
            <span class="field__label">Couleur</span>
            <input type="color" name="couleur" value="#e63946" />
          </label>

          <label class="field field--form">
            <span class="field__label">Pression actuelle (bar)</span>
            <input type="number" name="tirePressure" placeholder="2.4" min="0" max="6" step="0.1" inputmode="decimal" />
            <small class="field__error" data-error="tirePressure"></small>
          </label>

          <label class="field field--form">
            <span class="field__label">Pression recommandée (bar)</span>
            <input type="number" name="recommendedTirePressure" placeholder="2.5" min="0" max="6" step="0.1" inputmode="decimal" />
            <small class="field__error" data-error="recommendedTirePressure"></small>
          </label>

          <label class="field field--form field--wide">
            <span class="field__label">Notes d’entretien</span>
            <textarea name="maintenanceNotes" rows="3" placeholder="À signaler : bruit, freinage, etc."></textarea>
            <small class="field__error" data-error="maintenanceNotes"></small>
          </label>
        </div>

        <footer class="form__footer">
          <button type="button" class="btn" id="btn-annuler">Annuler</button>
          <button type="submit" class="btn btn--primary" id="btn-valider">Enregistrer</button>
        </footer>
      </form>
    </dialog>

    <!-- ===== Modèle (template) d'une carte véhicule, cloné par JS ===== -->
    <template id="tpl-carte">
      <article class="card">
        <div class="card__banner"></div>
        <header class="card__header">
          <div>
            <h3 class="card__title"></h3>
            <p class="card__subtitle"></p>
          </div>
          <button type="button" class="card__favorite" data-action="favori" aria-label="Ajouter aux favoris">
            <span class="card__heart" aria-hidden="true">♥</span>
          </button>
        </header>
        <ul class="card__info-list">
          <li><span class="card__info-label">Kilométrage</span><span class="card__mileage"></span></li>
          <li><span class="card__info-label">Prix</span><span class="card__price"></span></li>
          <li><span class="card__info-label">Immat.</span><span class="card__plate"></span></li>
        </ul>
        <div class="card__maintenance" hidden>
          <p class="card__maintenance-title">Entretien</p>
          <ul class="card__maintenance-list"></ul>
        </div>
        <section class="card__driving-mode" aria-label="Mode de conduite">
          <p class="card__driving-mode-title">Mode de conduite</p>
          <div class="card__driving-options" role="group" aria-label="Choisir un mode de conduite">
            <button type="button" class="card__driving-option" data-action="mode-conduite" data-mode="comfort">🚗 Confort</button>
            <button type="button" class="card__driving-option" data-action="mode-conduite" data-mode="sport">🏎️ Sport</button>
            <button type="button" class="card__driving-option" data-action="mode-conduite" data-mode="eco">🌱 Éco</button>
            <button type="button" class="card__driving-option" data-action="mode-conduite" data-mode="rain">🌧️ Pluie</button>
            <button type="button" class="card__driving-option" data-action="mode-conduite" data-mode="winter">❄️ Hiver</button>
          </div>
          <p class="card__driving-current" aria-live="polite"></p>
          <ul class="card__driving-recommendations"></ul>
          <div class="card__driving-settings">
            <p class="card__driving-settings-title">Réglages du mode actif</p>
            <label class="card__driving-field" data-setting-field="tire-pressure">
              <span>Pression recommandée (bar)</span>
              <input type="number" data-setting="tire-pressure" min="0" max="6" step="0.1" inputmode="decimal" placeholder="2.5" />
            </label>
            <label class="card__driving-field" data-setting-field="consumption">
              <span>Objectif de consommation (L/100 km)</span>
              <input type="number" data-setting="consumption" min="0" max="50" step="0.1" inputmode="decimal" placeholder="6.0" />
            </label>
            <label class="card__driving-field card__driving-field--wide">
              <span>Note pour ce mode</span>
              <textarea data-setting="note" rows="2" maxlength="200" placeholder="Ex. conduite souple en ville"></textarea>
            </label>
            <button type="button" class="btn btn--small" data-action="save-mode-settings">Enregistrer les réglages</button>
          </div>
        </section>
        <footer class="card__footer">
          <span class="badge card__fuel"></span>
          <div class="card__actions">
            <button type="button" class="btn btn--small" data-action="modifier">Modifier</button>
            <button type="button" class="btn btn--small btn--danger" data-action="supprimer">Supprimer</button>
          </div>
        </footer>
      </article>
    </template>

    <!-- Notifications -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
